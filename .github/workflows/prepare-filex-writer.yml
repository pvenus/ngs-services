name: Prepare Filex writer source proof
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  writer-source-proof:
    if: github.repository == 'pvenus/ngs-services' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact Filex writer closure
        run: python3 -B ops-service/deploy/prepare_filex_writer.py "$RUNNER_TEMP/filex-proof"
      - name: Verify preparation in isolation
        run: python3 -B ops-service/deploy/test_prepare_filex_writer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: filex-concept-writer-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/filex-proof/filex-writer.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14
