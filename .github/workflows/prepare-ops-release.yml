name: Prepare OPS-only release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ops-only-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify OPS, never other service targets
        run: |
          cd ops-service
          python3 -B -m unittest -q
          node --check deployments.js
          node --test test_alarms_ui.mjs
          cd deploy
          python3 -B -m unittest -q
      - name: Produce OPS-only source release evidence
        env:
          RUN_COMMIT: ${{ github.sha }}
        run: |
          install -d "$RUNNER_TEMP/ops-release"
          git archive --format=tar "$RUN_COMMIT" ops-service > "$RUNNER_TEMP/ops-release/ops-only.tar"
          tree=$(git rev-parse "$RUN_COMMIT:ops-service")
          archive_sha=$(sha256sum "$RUNNER_TEMP/ops-release/ops-only.tar" | cut -d' ' -f1)
          printf '{"schemaVersion":"ops.self-update-release.v1","sha":"%s","tree":"%s","archiveSha256":"%s"}\n' \
            "$RUN_COMMIT" "$tree" "$archive_sha" > "$RUNNER_TEMP/ops-release/manifest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ops-only-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ops-release/
          compression-level: 0
          if-no-files-found: error
