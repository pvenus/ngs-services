[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-catalog-service"
version = "0.1.0"
description = "Service registry, versioned execution contracts, and Codex artifact templates"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
include = ["catalog_service*"]

[tool.setuptools.package-data]
catalog_service = ["execution_contracts.json"]
