<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPS · 배포</title><link rel="stylesheet" href="/style.css"><script defer src="/deployments.js"></script>
<main>
<header><div><span class="brand">OPS</span><h1>배포</h1><p>검증된 GitHub 커밋으로 서비스별 배포를 요청합니다.</p></div><div class="actions"><button id="deploy-refresh" type="button">새로고침</button></div></header>
<nav class="ops-tabs" aria-label="OPS 화면"><a href="/requests">요청 상태</a><a href="/services">서비스 상태</a><a href="/alarms">알람</a><a href="/deployments" aria-current="page">배포</a></nav>
<p id="deploy-status" role="status" aria-live="polite">배포 상태를 확인 중입니다.</p>
<section id="deploy-gate" hidden>
 <p><label for="deploy-owner-key">Mac 소유자 확인 코드</label>
 <input id="deploy-owner-key" type="password" inputmode="text" autocomplete="off" spellcheck="false" maxlength="64">
 <button id="deploy-unlock" type="button">잠금 해제</button></p>
</section>
<section id="deploy-details" hidden aria-label="배포 대상">
 <div class="deploy-summary">
  <p>개별 배포를 요청하거나 등록된 모든 대상을 한 번에 배포할 수 있습니다. OPS 자체는 별도로 배포합니다.</p>
  <button id="deploy-all" class="deploy-all" type="button" disabled>모두 배포</button>
 </div>
 <div id="deploy-groups" class="deploy-groups"></div>
</section>
</main></html>
